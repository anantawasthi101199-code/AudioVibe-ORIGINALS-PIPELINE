# A complete fantasy or romance drama in three minutes, Spellbound
# (2026-10-29).
#
# THE MICRO-DRAMA, MADE FOR EARS, AND WHOLE. One person, one impossible
# situation (a genie, a ghost, an alien, a curse, a time loop), and a last line
# that turns the story over. Not an excerpt and never "to be continued".
#
# THE TWIST IS WRITTEN FIRST. The map item's `covers` names the PLANT and the
# TWIST; the plant goes in the first part as an ordinary detail, so a second
# listen shows it was there all along. The ending is joyful, sweet or funny.

id: drama-short
name: Three-minute drama

research: single

kind: short
intent: >
  One complete fantasy or romance story in under three minutes, told by one
  narrator with dialogue: a person, an impossible situation, and a last line
  that turns the whole thing over, planted from the start, ending in joy.

targetSeconds: [140, 180]

serialised: false

loops:
  - id: the_twist
    question: What is really going on?

beats:
  - id: setup
    type: cold_open
    seconds: [40, 60]
    function: >
      One person, already in the middle of something impossible, and what they
      want.
    opens: [the_twist]
    constraints:
      - >
        THE FIRST SENTENCE IS THE IMPOSSIBLE THING, said plainly. "The genie
        came out of the lamp on a Tuesday, and the first thing he did was
        apologise." No greeting, no "this is a story about".
      - >
        THE RULE OF THE MAGIC IN ONE SENTENCE: what it does and what it costs.
      - >
        AT MOST THREE PEOPLE IN THE WHOLE SHORT, each named or described the
        moment they arrive.
      - >
        PLANT THE TWIST HERE, in plain sight, as an ordinary detail.

  - id: turn
    type: escalation
    seconds: [70, 90]
    function: >
      The situation pushes back, in scenes with dialogue, until somebody has to
      choose.
    constraints:
      - >
        SCENES AND DIALOGUE, every line attributed. Banter is welcome; nobody
        explains their own feelings.
      - >
        LEAD THE LISTENER TO THE OBVIOUS READING, fairly. The twist costs
        nothing if nothing was believed.
      - Two or three turns, each continuing the last.

  - id: twist
    type: button
    seconds: [20, 35]
    function: >
      The reveal that turns the story over, and one line that lands it in joy.
      The channel's outro follows.
    closes: [the_twist]
    constraints:
      - >
        THE REVEAL USES THE PLANT. The detail from the first part comes back and
        means something new.
      - >
        END ON THE TURN, warm, funny or sweet. One or two short sentences after
        the reveal at most. No moral, no explaining the twist.
      - No goodbye and no follow ask; the channel's fixed outro is added after this.

tensionCurve: [0.7, 0.85, 1.0]
