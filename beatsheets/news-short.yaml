# A news report, under three minutes, from one article.
#
# FOUR PARTS, EXPLAINER-STYLE. hello (greeting + the ongoing story in a line or
# two), news (what happened, when, who reported it), explain (cause and effect
# in plain terms, one everyday comparison), close (where it leaves things, then
# the follow).
#
# WHY NOT THE INVERTED PYRAMID ANY MORE. The first version was written the way
# wire-service radio is: news in the first sentence, detail, recap. It was
# correct and the owner heard it as robotic: "no personal human touch", no
# hello, no context, nothing explained. A feed short is not a bulletin between
# two songs; the listener chose to press play on a person, and the value is
# understanding the news, not just hearing it. The fact discipline is unchanged
# and still checked for free; only the telling changed.
#
# WHY SEPARATE PARTS. One part carrying everything gives the goodbye no budget,
# and a writer spends the allowance before it arrives.
#
# NOT A TRAILER. A report on this channel never points at a longer version and
# never ends on a teaser. The owner's instruction: "the content should be
# complete".
#
# Written by the news lane (src/pipeline/news.ts), never by the story writers.

id: news-short
name: News, explained, under three minutes

research: single

kind: short
intent: >
  Today's most important development on the channel's beat, from one named
  source, told by a presenter with some warmth: the big picture, what happened,
  what it means in plain terms, and where it leaves things. Under three minutes.

# 160 at the top, not 180: speech rate is an estimate and the writer overshoots
# its budget by about ten per cent. news/check.ts measures the audio against 180.
targetSeconds: [120, 160]

serialised: false

loops:
  - id: the_news
    question: What has happened, and what happens now?

beats:
  # THREE STEPS, from the owner's channel sheet (2026-09-30): what happened
  # today, why it actually matters to you, what happens next. Crisp and clear.
  - id: what_happened
    type: stakes
    seconds: [40, 55]
    function: >
      Step one, WHAT HAPPENED TODAY: a one-line hello, then the news itself,
      plainly, with who reported it and when.
    opens: [the_news]
    constraints:
      - >
        ONE LINE OF HELLO in your own words, then straight to it. "Hi, it's
        Rowan." Not a speech.
      - >
        THE NEWS IN PLAIN WORDS: who did what, where, and when. Name the source
        once, naturally ("this morning, Reuters reported...").
      - >
        ONE SENTENCE OF BACKGROUND only if somebody who has not followed the
        story would be lost without it.
      - Attribution before every claim that is a claim.
    minClaims: 0

  - id: why_it_matters
    type: mechanism
    seconds: [45, 65]
    function: >
      Step two, WHY IT ACTUALLY MATTERS TO YOU: the chain from this event to an
      ordinary person's life, step by step.
    constraints:
      - >
        SAY IT OUT LOUD AS THE STEP: "So why does this matter to you?" then
        answer it. The listener should hear the structure.
      - >
        CAUSE AND EFFECT, STEP BY STEP, down to something a person feels:
        prices, jobs, travel, safety, what is on the news next week.
      - >
        EXPLAIN UNFAMILIAR THINGS the first time, in a clause: what sanctions
        do, what a tariff is.
      - >
        EXPLAIN, DO NOT ADD. At most two facts not already said, only if
        needed. Each side's position fairly, with who said it. No view of your
        own.
    minClaims: 0

  - id: whats_next
    type: outro
    seconds: [25, 40]
    function: >
      Step three, WHAT HAPPENS NEXT, then the goodbye and the follow.
    closes: [the_news]
    constraints:
      - >
        SAY IT AS THE STEP: "So what happens next?" Then only what the source
        says is scheduled, threatened or expected. Never invent an unknown; if
        nothing is known, say what to watch for.
      - >
        THEN THE GOODBYE, warm and quick, asking the listener to follow for more.
        The last thing said.
      - No opinion, no moral, no "only time will tell".
    minClaims: 0

# Lands the news, carries the weight in why it matters, eases out on what next.
tensionCurve: [0.85, 1.0, 0.5]
