# A news report, under three minutes, from one article.
#
# FOUR PARTS, EXPLAINER-STYLE. hello (greeting + the ongoing story in a line or
# two), news (what happened, when, who reported it), explain (cause and effect
# in plain terms, one everyday comparison), close (where it leaves things, then
# the follow).
#
# WHY NOT THE INVERTED PYRAMID ANY MORE. The first version was written the way
# wire-service radio is: news in the first sentence, detail, recap. It was
# correct and the owner heard it as robotic: "no personal human touch", no
# hello, no context, nothing explained. A feed short is not a bulletin between
# two songs; the listener chose to press play on a person, and the value is
# understanding the news, not just hearing it. The fact discipline is unchanged
# and still checked for free; only the telling changed.
#
# WHY SEPARATE PARTS. One part carrying everything gives the goodbye no budget,
# and a writer spends the allowance before it arrives.
#
# NOT A TRAILER. A report on this channel never points at a longer version and
# never ends on a teaser. The owner's instruction: "the content should be
# complete".
#
# Written by the news lane (src/pipeline/news.ts), never by the story writers.

id: news-short
name: News, explained, under three minutes

research: single

kind: short
intent: >
  Today's most important development on the channel's beat, from one named
  source, told by a presenter with some warmth: the big picture, what happened,
  what it means in plain terms, and where it leaves things. Under three minutes.

# 160 at the top, not 180: speech rate is an estimate and the writer overshoots
# its budget by about ten per cent. news/check.ts measures the audio against 180.
targetSeconds: [120, 160]

serialised: false

loops:
  - id: the_news
    question: What has happened, and what happens now?

beats:
  - id: hello
    type: context
    seconds: [12, 20]
    function: >
      Say hello, and set up the ongoing story this belongs to in a sentence or
      two, then hand into the news.
    opens: [the_news]
    constraints:
      - >
        A GREETING IN YOUR OWN WORDS, then straight to it. "Hi, it's Rowan."
        One line, not a speech.
      - >
        THE BIG PICTURE in one or two sentences: what ongoing story this is part
        of, so somebody who has not followed it knows where they are. Only what
        the source says about it.
      - >
        HAND OVER out loud: "So here's what happened." The news itself belongs
        to the next part.
    minClaims: 0

  - id: news
    type: stakes
    seconds: [25, 40]
    function: >
      What happened, when it was reported and who reported it, plainly.
    constraints:
      - >
        NAME THE SOURCE HERE, once: the outlet reported it, and when, said
        naturally ("late on Monday evening", "this morning").
      - Who did what, in plain words, and each side's first response if the source has it.
      - Attribution before every claim that is a claim.
    minClaims: 0

  - id: explain
    type: mechanism
    seconds: [50, 75]
    function: >
      What it means, in simple terms: the chain of events step by step, one
      everyday comparison, and any unfamiliar thing explained plainly.
    constraints:
      - >
        CAUSE AND EFFECT, STEP BY STEP. This happened, so that happened, which is
        why it matters now. A listener should be able to retell it.
      - >
        ONE EVERYDAY COMPARISON where it genuinely helps, clearly your own
        illustration, never a new fact. Two at most.
      - >
        EXPLAIN UNFAMILIAR THINGS the first time, in a clause: what a blockade
        is, what sanctions do, who is mediating.
      - Each side's position fairly, with who said it. No view of your own.
      - Continue from the last part. Never a fresh start.
    minClaims: 0

  - id: close
    type: outro
    seconds: [15, 25]
    function: >
      Where it leaves things, then the goodbye and the follow.
    closes: [the_news]
    constraints:
      - >
        PULL IT TOGETHER in one or two sentences, fresh words: where things
        stand now, and what happens next only if the source says so. Never
        invent an unknown.
      - >
        THEN THE GOODBYE, warm and quick, asking the listener to follow for more
        on the beat. The last thing said.
      - No opinion, no moral, no "only time will tell".
    minClaims: 0

# Settles in with the hello, lands the news, carries the weight in the
# explanation, and eases out. Below the peak at the open, as the shipped-format
# check asks.
tensionCurve: [0.5, 0.85, 1.0, 0.45]
