# One myth, told in full, with the record of it woven through.
#
# WHY A MYTH DOES NOT FIT THE TOLD-STORY SHEET. That sheet is built for a crime
# or a disaster: ordinary people, then the first thing that goes wrong, then it
# gets worse, then the accounting. A myth has none of that shape. Nothing "goes
# wrong" in the Descent of Inanna - a goddess decides to visit the underworld
# and is required to give up one thing at each of seven gates, and that is the
# story working exactly as intended by everyone in it.
#
# What a myth has instead is a WORLD with rules, and a story that only means
# anything once the rules are known. A listener who does not know that Xibalba's
# lords cheat at the ballgame, or that a Sumerian underworld charges an entry
# toll in clothing, cannot follow what happens next - and no amount of good
# prose rescues that, because the problem is missing knowledge rather than
# missing craft.
#
# So the world gets its own beat, before the story, and it is a big one. That is
# the single biggest structural difference from every other sheet here.
#
# THE PROVENANCE IS WOVEN, NOT BOLTED ON. This show's whole claim is that the
# story told is the one somebody actually wrote down, so where it came from is
# not a preamble to get through - it is information that lands hardest at the
# moment it bites:
#
#   "...and here the oldest manuscript stops. What happens next survives only
#    in a version a monk copied four hundred years later, and he was not a
#    neutral party."
#
# Said at the start, that is bibliography. Said at the point where the text runs
# out, it is the most interesting sentence in the episode. So no beat is set
# aside for it, and two beats are required to carry it where it belongs.
#
# FIVE BEATS, and fewer is the direction every finding points: each boundary is
# a seam between two separately written calls, and every fault found so far has
# been at a join or caused by a check that could only see one beat.
#
# THE COLD OPEN IS GONE, 2026-09-12, and it was a mistake carried over from
# television. A listener said it plainly: "episodes start from nowhere... it
# takes me 2-3 minutes to just understand what is happening... this is only
# listening and visualizing."
#
# A teaser before the titles works on screen because the picture is already
# doing the orienting: you can SEE it is a basement, at night, with four men and
# a drill. Strip the picture out and the same forty seconds is a voice
# describing an unexplained thing happening to unnamed people in an unnamed
# place, and the listener spends all of it guessing instead of listening. Then
# the orientation arrives and they have to go back and re-understand what they
# already heard.
#
# So the episode now opens by saying what it is. What happened, to whom, where,
# when, and why it is worth a quarter of an hour. Everything after that is in
# order, and the listener is never behind.
#
# THIS ALSO SWITCHES OFF THE HOOK COMPETITION, which is deliberate rather than
# incidental. writeScript only runs it when the first beat is typed `cold_open`,
# and its prompt says "trust the listener, do not explain" and "never announce
# the episode" - the exact instructions this change exists to reverse. Sixteen
# opening lines were being generated and judged per episode for a beat that
# should not exist. That cost goes too.

id: myth-told
name: Myth, told
kind: long
intent: >
  One myth from one culture, told in full and in order to somebody who has never
  heard of it, with what is actually known about where it comes from surfacing
  at the points in the telling where it changes what you are hearing.

targetSeconds: [780, 1080]

serialised: false

loops:
  - id: the_story
    question: What happens in this story, and where does it come from?

beats:
  - id: opening
    type: orientation
    seconds: [95, 145]
    function: >
      Say what this story is, whose it is, how old, and what happens in it in
      one line - before any of it is told.
    opens: [the_story]
    constraints:
      - >
        START BY SAYING WHAT THIS IS. The story, the culture it belongs to, and
        the text it survives in, in the first two sentences. A listener with
        nothing to look at and no knowledge of this pantheon cannot be dropped
        into a scene; they will spend it guessing rather than listening.
      - >
        Say how old it is in a way a person can hold. "Older than the Iliad" is
        worth more than a date, and a date on its own is worth almost nothing.
      - >
        Give the shape of the story in one or two sentences, before telling it.
        Knowing where a story is going does not spoil a myth - everybody who
        first heard these already knew how they ended - and it lets a listener
        follow the telling instead of tracking it.
      - Talk to the listener directly here. This is the one beat that may.
      - No suspense and no teasing. Nothing here is being saved for later.
    minClaims: 3

  - id: world
    type: stakes
    seconds: [200, 270]
    function: >
      The world this story happens in, as the people who told it understood it.
      The rules that make everything after this make sense.
    constraints:
      - >
        THE RULES COME FIRST AND THEY ARE THE POINT OF THIS BEAT. A listener who
        does not know them hears the story as a sequence of arbitrary events,
        and that is missing knowledge rather than a writing failure.
      - >
        THE RULES ARE WHATEVER THE STORY ACTUALLY RESTS ON, which is not always
        a pantheon. For a myth it is who the gods are and what they want, what
        the dead are owed, what a name or a gift or a debt does. For something
        that happened in the world it is who ruled the place and how recently
        they had taken it, what the last war was and who fought whom over what,
        what a person's life there was actually like, and what everybody in that
        village took for granted. Ask what the listener has to believe before the
        story makes sense, and give them that.
      - >
        PLACE IT ON A MAP AND A CALENDAR THEY ALREADY HAVE. Where this is in
        terms of a country they could find, and when it is in terms of something
        they can date. A name and a year are not a place and a time.
      - >
        Explain them the way the tellers believed them, without stopping to say
        whether they are true. A myth explained from outside stops being a story
        and becomes a lecture about somebody else's mistake.
      - Name the people and powers here, before they act in the next beat.
      - Concrete. What somebody in that world would actually do, and when.
    minClaims: 5

  - id: story
    type: escalation
    seconds: [260, 340]
    function: >
      The myth itself, from the beginning, in the order it happens, at length.
    constraints:
      - Chronological, at a pace that lets each thing land before the next.
      - Tell it as a story, not as a summary of a story. Scenes, not a synopsis.
      - Do not explain the meaning as you go. The story carries it.
      - >
        WHERE THE TEXT ITSELF MATTERS, SAY SO HERE rather than saving it. A gap
        in the manuscript, a line nobody can translate, a detail only one
        version has - these belong at the moment they bite, and they are usually
        the most interesting sentence in the beat.
    minClaims: 7

  - id: ending
    type: payoff
    seconds: [180, 250]
    function: >
      How it ends, what that ending meant to the people who told it, and where
      the surviving versions do not agree.
    closes: [the_story]
    constraints:
      - Finish the story first. The ending is a scene, not a conclusion.
      - >
        Then say what it meant to them - what it explained, what it warned, what
        it justified. Still from inside: what THEY took from it.
      - >
        WHERE THE VERSIONS DISAGREE, SAY SO PLAINLY AND SAY WHO SAYS WHAT. Most
        myths survive in more than one telling and the tellings contradict each
        other, which is information rather than an embarrassment. Name the
        variant, name where it comes from, and do not pretend one is settled
        when it is not.
      - Be exactly as certain as the sources are and no more.
      - No moral of your own. What it meant to them is the ending.
    minClaims: 6

  - id: close
    type: outro
    seconds: [65, 100]
    function: >
      Land the episode. Give it an ending that feels like one, and leave the
      listener holding something.
    constraints:
      - >
        THIS IS AN ENDING, NOT A STOP. An episode that runs out of material and
        halts leaves a listener with nothing to keep, whatever the twelve
        minutes before it were worth. The last thing said is the thing they walk
        away with, so it has to be chosen rather than whatever happened to be
        left over.
      - >
        Land it one of these three ways, whichever the story actually earned.
        RETURN to something from earlier in the episode, so that it means
        something different now that the listener knows the rest. Or FOLLOW IT
        FORWARD - what the thing became, what is still standing, who is still
        alive, what changed because of it. Or NAME WHAT WAS NEVER SETTLED, and
        leave it open honestly rather than tidying it.
      - >
        You may gather the episode in a sentence before you land it, and one
        sentence is the limit. A beat-by-beat recap is not an ending, it is the
        episode again in worse words.
      - >
        Leave the listener with something to hold. Not a lesson and not a
        question asked of them - a fact, an image, or a thing left unresolved
        that sits with them on its own.
      - No moral, and nothing about what it says about people or about us now.
      - "No sign-off, no call to action, no naming the show, no next-time."
    # THE ENDING STILL RESTS ON SOMETHING SOURCED. A callback returns to a claim
    # the episode already used, which counts - what is not allowed is an ending
    # the writer made up because the beat had to end somehow.
    minClaims: 1

# Opens on a scene, drops through the orientation because that is where the
# listener decides to stay, and then climbs steadily. The `world` beat sits low
# on purpose: it is explanation, and explanation that pretends to be exciting is
# the thing this network keeps having to cut out. It earns its place by making
# the next two beats legible, not by being thrilling.
#
# The peak is the story rather than the ending, which is the opposite of the
# crime sheet and is right for a myth: a myth's ending is usually quiet, and
# often sad, and the tension has already done its work by then.
tensionCurve: [0.45, 0.5, 1.0, 0.85, 0.45]
