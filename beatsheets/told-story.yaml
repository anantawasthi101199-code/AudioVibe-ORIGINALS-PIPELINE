# One narrator, telling a true story in the order it happened.
#
# WHAT THIS FIXES, AND IT IS A FORMAT PROBLEM RATHER THAN A WRITING ONE. The
# first real episode measured well on every prose metric there is - short
# sentences, low clause depth, low information density, signposting present -
# and was still hard to follow. The reason was structural, in three parts:
#
#   1. IT NEVER SAID WHAT IT WAS ABOUT. It opened mid-argument, comparing two
#      documents, on the theory that a cold open earns attention. A listener who
#      has already pressed play does not need to be hooked, they need to be
#      oriented, and withholding that reads as having walked in late.
#   2. ITS SPINE WAS AN ARGUMENT, NOT A STORY. "Here is a document that
#      contradicts the accepted version" is analysis. It has a thesis, evidence
#      and a conclusion, and a listener has to hold the thesis in mind
#      throughout. A story has a sequence, and the sequence holds itself.
#   3. TWO VOICES FRAGMENTED IT. Changing speaker every couple of sentences
#      means nobody builds momentum, which reads as slow AND as complicated,
#      because the listener is tracking two threads instead of following one.
#
# So: one narrator, oriented early, chronological throughout.
#
# WHAT THE FIRST EPISODE ON THIS SHEET GOT WRONG, from a listener who heard four
# minutes of it. Three faults, and this sheet answers two of them - the third,
# the negation tic, is answered in script/forward.ts.
#
#   "the characters are being introduced randomly, not that there were five
#    people, out of which the first was X, the second Y, third Z, and then
#    explain their back stories"
#
# Exactly right, and worse than it sounds: Carl Wood walked OUT of the vault
# having never been introduced, Hugh Doyle was sentenced having never appeared,
# the man who led the second night was not in the episode at all, and the
# listener was never told how many men there were. The `before` beat now owns
# the roster, and the plan carries it as data so that it can be checked.
#
#   "it should just be informative and on track"
#
# THE OBJECTION BEAT IS GONE, and that is the substantive change here. It asked
# for the strongest version of the story where this reading is wrong, and what
# it produced was the episode stopping dead two thirds through to argue with
# itself about whether the men were careful professionals or proud old men, and
# then resuming. That is a structural version of going back on yourself, and no
# amount of writing quality rescues it, because the fault IS the halt.
#
# The thing it protected against is real: confident one-sidedness is the most
# common way generated content is false while every sentence is sourced. So the
# duty moved rather than disappeared. The payoff beat now has to say where the
# accounts disagree AT THE POINT IN THE STORY WHERE THEY DISAGREE, in a sentence
# or two, and keep going. A disagreement told in its place is information. The
# same disagreement told as a separate movement is an essay interrupting a
# story.
#
# FIVE BEATS, DOWN FROM SEVEN. Two fewer seams, and the beats that remain are
# longer, which is the direction every fault found so far points: they have all
# been at a join, or caused by a check that could only see one beat.
#
# CHRONOLOGY IS THE WHOLE TECHNIQUE. Events in the order they happened need no
# scaffolding, because the listener already knows how time works. Every time a
# script jumps - "but to understand that, we need to go back" - it spends
# attention on bookkeeping. This sheet permits exactly one jump, at the turn,
# and makes it the point of the episode rather than a convenience.
#
# THE TENSION CURVE IS NOT A CLIMB. It rises, drops at the orientation on
# purpose, and climbs again. That dip is the beat where the listener relaxes and
# decides to stay, and a format that never lets them relax is one they leave.
#
# SEVEN BEATS, NOT TEN, AND THE COUNT IS A DESIGN DECISION. Every beat boundary
# is a seam: two pieces of writing produced by separate calls, joined. The
# joins are where an episode stops feeling like one telling, and ten beats in
# fifteen minutes means a seam every ninety seconds.
#
# It is also where revision does its damage. A beat that fails a style check is
# rewritten, and every check it is being rewritten for looks at that beat ALONE
# - sentence variance, opening words, how the voices differ. None of them can
# see whether the rewrite still follows from the beat before. Fewer beats means
# fewer joins exposed to that.
#
# What is lost is resolution in the retention data: a three-minute beat tells
# you less about WHERE somebody stopped than a ninety-second one. That is a real
# cost and it is worth paying, because a smooth episode nobody leaves is more
# useful than precise data about why they left a rough one.

#
# CONSTRAINTS CUT ROUGHLY IN HALF, 2026-09-12, and the reason is a correction
# worth keeping: "don't micromanage the creator with prompts, don't try to fix
# it to a template too strictly, let the models have creativity in writing,
# language models are inherently good at writing, only fact check."
#
# That is right, and the drift it names is real. Every fault found in an episode
# got answered with another constraint, and the sheet grew from a description of
# what each beat is FOR into a specification of how to write it - present tense
# here, a place and a person in the first two sentences, start with one or two
# named people doing something ordinary. The result passed everything and
# sounded managed, because it was.
#
# The line kept is this: a constraint earns its place if it is about WHAT THE
# BEAT MUST ACHIEVE or about a fact the writer cannot know. It does not earn its
# place by describing a technique for achieving it. So the roster survives (the
# listener genuinely cannot follow names they were never given), chronology
# survives (it is the format), and the honesty rules survive (they are the
# show). The craft instructions are gone.
#
# THE COLD OPEN IS GONE, 2026-09-12, and it was a mistake carried over from
# television. A listener said it plainly: "episodes start from nowhere... it
# takes me 2-3 minutes to just understand what is happening... this is only
# listening and visualizing."
#
# A teaser before the titles works on screen because the picture is already
# doing the orienting: you can SEE it is a basement, at night, with four men and
# a drill. Strip the picture out and the same forty seconds is a voice
# describing an unexplained thing happening to unnamed people in an unnamed
# place, and the listener spends all of it guessing instead of listening. Then
# the orientation arrives and they have to go back and re-understand what they
# already heard.
#
# So the episode now opens by saying what it is. What happened, to whom, where,
# when, and why it is worth a quarter of an hour. Everything after that is in
# order, and the listener is never behind.
#
# THIS ALSO SWITCHES OFF THE HOOK COMPETITION, which is deliberate rather than
# incidental. writeScript only runs it when the first beat is typed `cold_open`,
# and its prompt says "trust the listener, do not explain" and "never announce
# the episode" - the exact instructions this change exists to reverse. Sixteen
# opening lines were being generated and judged per episode for a beat that
# should not exist. That cost goes too.

id: told-story
name: Told story
kind: long
intent: >
  One true story, told by one person in the order it happened, to somebody who
  has never heard of it and will not be looking at anything while they listen.

targetSeconds: [720, 1000]

serialised: false

loops:
  - id: the_question
    question: What actually happened here, and how did it end?

beats:
  - id: opening
    type: orientation
    seconds: [95, 145]
    function: >
      Say what this episode is about, completely, before anything happens. What
      the thing was, who it happened to, where, when, and why it is worth
      a quarter of an hour.
    opens: [the_question]
    constraints:
      - >
        START BY SAYING WHAT THIS IS. Not a scene, not a detail held back, not a
        question. The first two sentences name the thing and place it: what
        happened, and where and when. A listener has nothing to look at, so
        anything withheld here is a listener guessing instead of listening.
      - >
        Then the rest of the context they need to follow what is coming: roughly
        who is involved and how many, what kind of place this is, and what was
        normal there before any of it started.
      - >
        Say how big it was in plain terms - how many people, how much money, how
        long it took. Scale is what somebody uses to decide whether to stay.
      - "Say what the episode will settle by the end. A promise, kept later."
      - Talk to the listener directly here. This is the one beat that may.
      - >
        No suspense and no teasing. This beat trades mystery for trust, and that
        is the trade. Nothing here is being saved for later.
      - >
        Warm and spoken, not a briefing. This is somebody telling you what they
        are about to tell you, in the order a person would actually say it.
    minClaims: 3

  - id: before
    type: stakes
    seconds: [190, 250]
    function: >
      Who these people were before any of it happened, and then everything that
      happened up to the first moment something was genuinely wrong.
    constraints:
      - >
        THE ROSTER COMES FIRST, and this one is not a matter of taste: say how
        many there were, then introduce them with something about each that the
        listener can hold on to. A name that arrives mid-action costs the
        listener the sentence it arrives in, and they do not get it back.
      - Then chronological, to the first moment something is genuinely wrong.
      - One beat, one continuous run of time. Do not break it into sections.
    minClaims: 7

  - id: wrong
    type: escalation
    seconds: [190, 250]
    function: >
      It gets worse and faster than anyone involved can keep up with, and then
      the thing happens that changes what the whole story has been about.
    opens: []
    constraints:
      - Keep moving forward in time until the turn, which may look back once.
      - Say what the people involved believed at the time, not what we know now.
      - >
        At the turn, tell what happened. Do not announce that a turn is
        happening, do not say the story is not the one they thought they were
        in, and do not tell the listener what they believed. If it is a surprise
        they will feel it without help, and being told to be surprised is how a
        listener stops being surprised.
    minClaims: 6

  - id: payoff
    type: payoff
    seconds: [200, 270]
    function: >
      What actually happened, start to finish, now that it makes sense - and
      then what it cost, to whom, and what became of them.
    closes: [the_question]
    constraints:
      - Answer the promise made in the orientation, in the same words if you can.
      - Be exactly as certain as the sources are and no more.
      - >
        WHERE THE ACCOUNTS DISAGREE, SAY SO WHERE IT HAPPENS. If the people
        involved told it differently, or the record does not settle it, put that
        in at the moment in the story it belongs to, in a sentence or two, name
        who said what, and carry on. Never stop the story to weigh two readings
        against each other - a disagreement told in its place is information, a
        disagreement told as its own section is an essay interrupting a story.
      - "Then the accounting: names, numbers, years, what happened afterwards."
      - No moral. The accounting is the moral.
    minClaims: 6

  - id: close
    type: outro
    seconds: [65, 100]
    function: >
      Land the episode. Give it an ending that feels like one, and leave the
      listener holding something.
    constraints:
      - >
        THIS IS AN ENDING, NOT A STOP. An episode that runs out of material and
        halts leaves a listener with nothing to keep, whatever the twelve
        minutes before it were worth. The last thing said is the thing they walk
        away with, so it has to be chosen rather than whatever happened to be
        left over.
      - >
        Land it one of these three ways, whichever the story actually earned.
        RETURN to something from earlier in the episode, so that it means
        something different now that the listener knows the rest. Or FOLLOW IT
        FORWARD - what the thing became, what is still standing, who is still
        alive, what changed because of it. Or NAME WHAT WAS NEVER SETTLED, and
        leave it open honestly rather than tidying it.
      - >
        You may gather the episode in a sentence before you land it, and one
        sentence is the limit. A beat-by-beat recap is not an ending, it is the
        episode again in worse words.
      - >
        Leave the listener with something to hold. Not a lesson and not a
        question asked of them - a fact, an image, or a thing left unresolved
        that sits with them on its own.
      - No moral, and nothing about what it says about people or about us now.
      - "No sign-off, no call to action, no naming the show, no next-time."
    # THE ENDING STILL RESTS ON SOMETHING SOURCED. A callback returns to a claim
    # the episode already used, which counts - what is not allowed is an ending
    # the writer made up because the beat had to end somehow.
    minClaims: 1

# Opens warm rather than hot, drops through the orientation because that beat is
# where the listener relaxes and decides to stay, then climbs without a break to
# the turn and on into the payoff. There is no dip between them any more: the
# beat that used to sit there stopped the story to argue with itself, and the
# curve it produced - up, then down, then up - is what a listener hears as
# losing the thread. A told story earns its rest at the orientation and then
# does not stop again until it is over.
tensionCurve: [0.45, 0.66, 0.95, 1.00, 0.45]
