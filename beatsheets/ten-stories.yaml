# Ten self-contained stories from one research pass, to be cut into ten shorts.
#
# THIS FORMAT IS SCAFFOLDING AND IS NEVER PUBLISHED WHOLE. `sourceOnly` makes
# that mechanical rather than a convention: `make` stops after the script, so
# nothing renders twenty minutes of audio nobody will hear and nothing gates it
# as an episode it is not trying to be. The shorts are cut afterwards, and each
# is rendered, gated and published on its own.
#
# WHY THIS EXISTS AT ALL, AND IT IS ENTIRELY A COST ARGUMENT. Research is 49p of
# an 87p episode - more than writing and rendering put together. Ten standalone
# shorts on one subject pay for that ten times over the same ground, at roughly
# £5.80. One research pass fanned out into ten comes to about £1.20, and the
# claims are already verified by the time any short is written.
#
# WHAT THAT BUYS AND WHAT IT COSTS. It buys ten properly sourced shorts for the
# price of one episode. It costs the long version, which would be a list - ten
# mini-stories in twenty minutes is exactly the shape this network spent a week
# getting out of its narrative shows. Not publishing it is the honest response
# to that rather than a compromise.
#
# EVERY STORY IS COMPLETE ON ITS OWN, and that is the only structural rule that
# really matters here. A listener meets one of these in a feed with no idea what
# came before it. It cannot refer to another story, cannot assume the frame has
# been set up, and cannot end on "more on that next time". Ten separate small
# episodes that happen to have been researched together.

id: ten-stories
name: Ten stories
kind: long

# Never rendered whole, never published whole. See the note above.
sourceOnly: true

intent: >
  Ten self-contained stories on one subject, researched in a single pass and
  written to be cut apart - each one a complete short with its own opening,
  middle and landing.

# NO FLOOR AT ALL, on any of them. The range was 90 to 180 and the 90 was doing
# real harm: a story whose material runs out at sixty seconds was being written
# to ninety, and the only way to add thirty seconds to a finished story is to
# say something twice. A short that pads is more obviously manufactured than a
# short that is simply short.
#
# The ceiling stays, because past three minutes it is not a short.
#
# This total is never rendered, so it is arithmetic rather than a target.
targetSeconds: [900, 1800]

serialised: false

# NO LOOPS, AND THAT IS HONEST RATHER THAN LAZY. The loop machinery exists to
# make one episode hold a listener from a question opened early to an answer
# given late, and it checks that a format does not close its curiosity too soon.
# An anthology has no such arc: ten stories are heard separately, on different
# days, in whatever order a feed offers them, and each carries its own small
# shape entirely. A loop declared here would describe a listening experience
# nobody is going to have.
loops: []

beats:
  - id: story
    type: payoff
    repeats: 10
    seconds: [30, 180]
    function: >
      One complete story: what it was, who it happened to, what happened, and
      what it turned out to mean.
    constraints:
      - >
        COMPLETE ON ITS OWN. A listener meets this in a feed having heard
        nothing else. It may not refer to another story in the set, may not
        assume a frame has been established, and may not end on anything
        pointing elsewhere.
      - >
        SAY WHAT IT IS IN THE FIRST TWO SENTENCES. No cold open and no teasing.
        A listener who does not know what they are listening to spends the whole
        thing guessing instead of following.
      - >
        TELL IT TO THE END. The whole story: what set it off, what happened, how
        it finished, and what it left behind. If Garuda steals the nectar to
        free his mother, the story is not over until we learn what Vishnu made
        of him for it - stopping at the theft is stopping in the middle.
      - >
        A STORY THAT STOPS WHEN THE FACTS RUN OUT IS A STORY THAT STOPS IN THE
        MIDDLE. Use everything you are given. If the ending is genuinely not in
        the material, say what the record does and does not carry rather than
        trailing off as though the story simply ended there.
      - >
        In order. One thing leads to the next, and nothing is held back to be
        explained later.
      - >
        END ON SOMETHING THAT LANDS. The last line is what somebody remembers or
        sends on. A number, an image, or the thing nobody knew - and it comes
        AFTER the story has finished, not instead of the finish.
      - >
        WHERE THE ACCOUNTS DISAGREE, SAY SO IN A CLAUSE AND CARRY ON. Being
        short is not a reason to sound more certain than the record is, and a
        short is where overconfidence travels furthest - it is the format most
        likely to be heard alone and passed on. "Nobody agrees which of them
        decided" costs four words.
      - >
        No sign-off, no call to action, no naming the show, and nothing about
        what it says about us.
      - >
        THERE IS NO MINIMUM LENGTH. A story that is fully told in forty seconds
        is forty seconds long. Reaching for a floor means saying something
        already said, or describing something already described, and both are
        audible - a short that pads is more obviously manufactured than a short
        that is simply brief.
      - >
        ONE STORY, ONCE. Another story about the same god, the same king or the
        same object is welcome; the same EVENTS a second time is not. Each of
        these is heard alone, so a second telling is a short somebody has
        already heard, and a feed of them is where that gets noticed.
    # SIX, AND IT WAS FOUR, AND FOUR WAS THE REASON THE STORIES STOPPED HALFWAY.
    #
    # Extraction is told "needs >= N claims, and up to M", and a model reads the
    # floor as the target: with N of 4 it returned four to nine claims per story
    # when the ceiling allowed fifteen. The writer then used EVERY claim it was
    # given - 6 of 6, 8 of 8, 9 of 9, ten beats at a hundred percent - so the
    # shortness was never compression. There was nothing left to say.
    #
    # A myth with a beginning, a turn and an ending does not fit in four facts.
    minClaims: 6

# One entry, expanded to ten alongside the beat it belongs to. Flat, and that is
# the format rather than an absence of nerve: each story is heard on its own, so
# a curve rising across the set would describe a listening experience nobody is
# going to have.
tensionCurve: [0.8]
