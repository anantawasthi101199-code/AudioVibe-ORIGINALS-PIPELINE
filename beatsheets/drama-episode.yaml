# One episode of a serial drama, Spellbound (2026-10-29).
#
# THE SHORT-DRAMA ENGINE, MADE FOR EARS. The vertical drama apps (ReelShort,
# DramaBox, ShortMax) and the audio serial apps (Pocket FM) run on one shape:
# open inside a conflict, turn once in the middle, give the audience one moment
# of satisfaction, and end on a cliffhanger. Their episodes are one to two
# minutes; an audio listener with free eyes stays longer, so ours are five to
# ten minutes with the same rhythm.
#
# THE SEASON IS BROKEN FIRST. Each episode's card is in the map's `covers`:
# what happens, what is planted, what pays off, and the cliffhanger. The writer
# writes against its own card and the NEXT one, never write-then-split (see
# docs/DRAMA.md). The biggest twist sits about halfway (episode 5 of 10),
# where the apps put the paywall.
#
# THREE PARTS, like myth-story, because the owner hears five-part episodes as
# five fresh starts.
#
# ONE VOICE TELLS IT. Narrated with dialogue, by the channel's narrator: every
# line attributed, because the listener cannot see who is talking.

id: drama-episode
name: Serial drama episode

research: single

kind: long
intent: >
  One episode of a fantasy or romance serial, told by one narrator in scenes
  with dialogue: it opens inside a conflict, turns once, gives the listener a
  moment of satisfaction, and ends on a cliffhanger the next episode answers.

# 5-10 minutes. A ceiling, never a target.
targetSeconds: [300, 600]

serialised: true

loops:
  - id: the_hook
    question: What happens next?

beats:
  - id: cold_open
    type: cold_open
    seconds: [30, 80]
    function: >
      Open inside the conflict. In a later episode, pick up the last
      cliffhanger at the exact moment it left off.
    opens: [the_hook]
    constraints:
      - >
        THE FIRST LINE IS ALREADY TROUBLE. A line of dialogue, an insult, a
        door opening on the wrong person, a wolf's eyes turning gold. Never
        setup, never weather, never "In this episode".
      - >
        EPISODE ONE: after the first moment, two or three plain sentences on who
        she is and what she wants, and at most three names.
      - >
        EVERY LATER EPISODE: open on the exact moment the last cliffhanger left
        off, then one or two plain sentences that remind the listener who is who
        and what is at stake. Never the whole season.
      - No greeting, no channel name, no episode number said aloud.

  - id: story
    type: escalation
    seconds: [200, 440]
    function: >
      This episode's story, in scenes, building to one reversal and one moment
      of satisfaction, as the card describes.
    constraints:
      - >
        SCENES, NOT SUMMARY. Each turn is one scene: where we are, who is there,
        what someone is holding, what they say. The magic is described as
        plainly as a kettle.
      - >
        DIALOGUE CARRIES IT, AND EVERY LINE IS ATTRIBUTED. "Celeste laughed.
        'You? His bride?'" Name the speaker on or right after their first line
        in a scene; never two unattributed lines in a row.
      - >
        ONE REVERSAL IN THE MIDDLE. Something the listener believed a minute ago
        stops being true: an ally lies, a weakness is a power, the door was
        never locked.
      - >
        ONE MOMENT OF SATISFACTION, EVERY EPISODE. The underdog wins one round
        in front of the people who scorned her, a villain's lie is exposed, or
        the romance takes one real step. Let it land and let the listener enjoy
        it; do not rush past it.
      - >
        PEOPLE TALK LIKE PEOPLE. Short lines, banter, interruptions, a question
        answered with a question. Nobody explains their own feelings in full
        sentences.
      - >
        PLANT AND PAY OFF EXACTLY WHAT THE CARD SAYS, and show the planted thing
        again so the listener remembers it.
      - >
        MAGIC HAS RULES. A curse or a power works the same way every time; a
        new rule is shown before it matters.
      - Five to nine turns. Every turn continues the last one; none restarts.

  - id: cliffhanger
    type: cliffhanger
    seconds: [30, 80]
    function: >
      The turn that changes everything, ending on a question the next episode
      answers. The channel's outro follows.
    closes: [the_hook]
    constraints:
      - >
        END ON A REVEAL, AN ARRIVAL OR A LINE THAT CANNOT BE TAKEN BACK, which
        has already happened. Never "we'll find out". The last sentence is short
        and concrete.
      - >
        AIM AT THE NEXT CARD: the cliffhanger is the first thing the next
        episode picks up.
      - >
        THE FINALE (the last card of a serial) LANDS INSTEAD: the villain gets
        exactly what they deserve, the romance is promised, and the last image
        is one the listener met in episode one. Joy, not despair.
      - No goodbye, no "stay tuned"; the channel's fixed outro is added after this.

tensionCurve: [0.7, 0.85, 1.0]
