# A science story in three minutes, from one article.
#
# Eureka Tales' short, from the owner's channel sheet (2026-09-30): "story
# format of any invention, accidental inventions, anything with a bit of
# drama", told with "a curious beginning on what the mystery is, followed with
# the story". Same single-story lane and the same three-part shape as
# myth-short, because the job is the same: one complete story, by ear, from
# one source.

id: science-short
name: Science story, in three minutes

research: single

kind: short
intent: >
  One true story from science - an invention, an accident that became a
  discovery, a race to be first - told complete in under three minutes,
  opening on a line that names the subject and hooks, ending on how it was
  solved.

targetSeconds: [150, 185]

serialised: false

loops:
  - id: the_mystery
    question: What was the puzzle, and how was it cracked?

beats:
  - id: mystery
    type: cold_open
    seconds: [20, 30]
    function: >
      A banger first line that says exactly what this is the story of, and
      makes the journey to it sound impossible to skip. Then the first scene.
    opens: [the_mystery]
    constraints:
      - >
        THE FIRST SENTENCE NAMES THE THING, DEFINITIVELY, AND HOOKS. Say what
        this is the story of - the invention or discovery, by name - joined to
        the most surprising true fact about how it came to be: how long it
        took, how unlikely the start was, what it was copied from. For example:
        "This is the story of Velcro, and of the nearly twenty years it took one
        Swiss engineer to copy a weed." A listener should know the subject in
        the first five seconds and want the journey. (Owner, 2026-10-04: a
        short that hid its subject until the end lost people who did not know
        what they were listening to.)
      - >
        THEN DROP INTO THE FIRST SCENE: a place, a year, a person, a thing you
        could see. Two or three sentences.
      - >
        Every fact in the hook comes from the article. Never invent a number
        to make it punchier.
      - >
        No greeting, no naming the show, no "today we are going to look at". A
        listener in a feed gave you about three seconds.
      - Name the subject, but keep HOW it was solved for later. This part only opens the journey.
    minClaims: 0

  - id: story
    type: escalation
    seconds: [85, 105]
    function: >
      Who was there and what they did, in order, up to the moment it clicked.
    constraints:
      - >
        TELL IT IN ORDER, AS A STORY. People doing things, one after another,
        and why they did each one, in the same breath.
      - >
        EXPLAIN THE ONE IDEA THE STORY NEEDS, in plain words, at the moment it
        is needed. At most one or two unfamiliar things in the whole short.
      - >
        NAME AT MOST THREE PEOPLE. Everybody else is what they did - "his lab
        assistant", "a rival in Paris".
      - >
        THE WRONG TURN IS THE STORY. If somebody got it wrong first, or it
        happened by accident, give that its full weight.
      - Two or three turns, each continuing the last. No turn restarts.
    minClaims: 0

  - id: close
    type: payoff
    seconds: [35, 50]
    function: >
      How it was solved, what it changed, then the goodbye.
    closes: [the_mystery]
    constraints:
      - >
        ANSWER THE MYSTERY FROM THE OPENING, clearly and completely. A short
        that runs out of time before the answer has failed.
      - >
        ONE LINE ON WHAT IT CHANGED, concrete: a thing people use, a number, a
        place. Never "and the world was never the same".
      - >
        A CLEAR END, then the goodbye, which is where the follow is asked for.
        Warm and quick.
      - Never call anybody a genius.
    minClaims: 0

tensionCurve: [0.7, 1.0, 0.5]
