# One case, told in full, in three parts.
#
# THREE PARTS AND NOT FIVE, and the reason is the same one that changed the myth
# lane. Five beats each carrying their own brief produced five short essays butted
# together - "every time a new parah is started it is not a continuation of the
# previous parah, it has a fresh start altogether". A case is worse for it than a
# myth, because a listener following a calendar across a seam has to rebuild
# where they were in it.
#
# THE ORDER IS NOT THE ORDER THINGS HAPPENED, and that is the whole design. The
# chronology in the case file decides what is TRUE; this sheet decides what is
# TOLD FIRST. A listener will not care when something happened until they care
# who it happened to, so the person comes before the calendar, and one true
# moment comes before the person.
#
# WHAT IS DELIBERATELY ABSENT: a counterpoint beat. The factual lanes have one
# because a confident one-sided account of something real is the commonest way
# generated content is false while every sentence is sourced. Here the equivalent
# work is done inside the case file instead - `contested` is separated from
# `established` before a word is written, and the writer is shown both. A beat
# arguing the other side of a real person's case would be the show speculating,
# which is the one thing this lane may not do.

id: case-in-full
name: One case, in full
kind: long

intent: >
  One true case, from who it happened to through what was done about it to how
  it ended, told so that somebody with headphones in can picture it.

# Thirteen to seventeen minutes. Long enough to give the victim a life before
# anything happens to them, short enough for one walk.
targetSeconds: [780, 1020]

research: casefile

loops:
  - id: the_case
    question: What happened, and what was never settled about it?

beats:
  # FIVE PARTS, from the owner's channel sheet (2026-09-30): hook, context,
  # investigation, turning point, aftermath.
  - id: hook
    type: cold_open
    seconds: [90, 130]
    function: >
      The hook: open on one true moment from the case file and paint it.
    opens: [the_case]
    constraints:
      - Open on the moment in the case file's hook, and PAINT IT. Where we are,
        what time it is, what day, who is there, what it looks like. Take four
        or five sentences over it. Do not rush past it.
      - Say the date out loud in the first thirty seconds. A listener who does
        not know what year they are in is not following anything.
      - Never resolve anything here. End on the question the moment raises.
      - No sentence about crime in general, ever.

  - id: context
    type: context
    seconds: [150, 210]
    function: >
      The context: go back and introduce the people it happened to, properly,
      and the world they lived in, before anything happens to them.
    constraints:
      - Pick up from the moment the hook ended on, by name, then go back.
      - Who this is about - what they did, what they were like, what that week
        looked like. Give it real room.
      - The place and the time, so the rest makes sense, from the case file only.

  - id: investigation
    type: escalation
    seconds: [300, 400]
    function: >
      The investigation: the calendar of events in order, then what
      investigators did and found, as its own sequence. The longest part.
    constraints:
      - Pick up from the last thing the context said, by name.
      - Dates in order, said the way a person says them, with the gaps between
        them made felt - "eleven days later", not "on the twenty-fifth".
      - Every scene gets a time, a place and one physical detail, and every one
        of those comes from the case file rather than from you.
      - Keep the investigation separate from the crime's own timeline, so the
        listener always knows what was known when.
      - Anything marked alleged or disputed is attributed once, plainly, where
        it belongs. Say it once and then stop qualifying.
      - Stop just before the turning point. Do not reveal it here.

  - id: turning_point
    type: escalation
    seconds: [120, 170]
    function: >
      The turning point: the one discovery, mistake or confession that changed
      the case, told as a scene.
    constraints:
      - Pick up from the last thing the investigation said, by name.
      - ONE turning point, from the case file, told slowly as a scene with its
        time, place and physical detail.
      - Say plainly why it changed everything. If the record disputes it, say
        so once, attributed.

  - id: aftermath
    type: payoff
    seconds: [150, 210]
    function: >
      The aftermath: how it ended, what was never settled, and a last word
      about the person it happened to rather than about whoever did it.
    closes: [the_case]
    constraints:
      - Say plainly what happened in the end. A case that trails off has wasted
        the listener's time.
      - Name what the record does not say, where it matters. A gap said out loud
        is more trustworthy than one glided over.
      - The last thing the listener hears is about the victim, not the offender.
      - NO SIGN-OFF. No "thanks for listening", no "see you next time", no
        mention of a next episode. This is somebody's death, and a presenter
        stepping out from behind it to say goodbye is the single worst note
        this show could end on. It ends on the case and then it stops.

tensionCurve: [0.6, 0.45, 0.85, 1.0, 0.5]
