  # --- The Root Health: clean, fresh, gentle, trustworthy ---
  - id: root-health-short-a
    channel: root-health
    kind: short
    prompt: Light fresh plucked acoustic-guitar-like synth with soft marimba-like synth, major key, 88 BPM, clean and friendly.
  - id: root-health-short-b
    channel: root-health
    kind: short
    prompt: Gentle piano-like synth chords over an airy pad, major key, 80 BPM, calm and trustworthy.
  - id: root-health-long-a
    channel: root-health
    kind: long
    prompt: Soft organic ambient bed, warm pad with light plucked synth texture, major key, 75 BPM, gentle and clear.
  - id: root-health-long-b
    channel: root-health
    kind: long
