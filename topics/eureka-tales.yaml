# Eureka Tales' queue, from the owner's channel sheet (2026-09-30). Shorts are
# inventions and accidental discoveries with a bit of drama (science-short);
# long form - controversial science, space journeys, Nobel prize winners,
# debunks - is made with `--format told-story --series "..."`.
topics:
  - How penicillin was discovered by accident when Alexander Fleming left a dish
    of bacteria out over a holiday
  - How the microwave oven was invented after a melted chocolate bar in Percy
    Spencer's pocket
  - How X-rays were discovered by Wilhelm Roentgen in a darkened laboratory in
    1895
  - How the Post-it note came from a glue that failed
  - How Velcro was invented after a walk with a dog covered in burrs
  - How the pacemaker was invented when Wilson Greatbatch fitted the wrong
    resistor
