# What Mythic Archives tells next, in order, taken from the top.
#
# WHAT MAKES A GOOD ENTRY HERE, and it is a stricter test than it looks, because
# this show is on the FACTUAL lane. The story is told freely, but every
# assertion binds to a quote from a text that can actually be fetched. So:
#
#   1. THERE IS A TEXT, ONLINE, IN ENGLISH. A translation on Sacred Texts, the
#      Oxford ETCSL, Project Gutenberg or a university corpus. Without one the
#      episode cannot be made at all - the extractor has nothing to bind to and
#      the run abandons at the corpus stage.
#   2. THE STORY HAS A SEQUENCE. Something happens, then something else, and
#      the order matters. A pantheon is a subject, not a story; "a goddess
#      goes down through seven gates and is charged a toll at each one" is a
#      story.
#   3. THE WORLD NEEDS EXPLAINING. This show's third beat is the rules of the
#      world, and a myth that works fine without them is a myth that does not
#      need this show.
#   4. THE VERSIONS DISAGREE, or the manuscript has a hole in it, or the
#      collector changed something. This is what the `ending` beat is for, and
#      a story with one settled text gives it nothing to do.
#   5. LESSER KNOWN, at least outside its own culture. Not a test of obscurity
#      for its own sake - a story everybody already knows leaves the `world`
#      beat with nothing to establish.
#
# NOT ON THIS LIST, deliberately: anything from a living tradition that is
# closed, initiatory or not told outside the community. Availability in a
# colonial-era translation is not the same as permission, and the show's taboo
# about living traditions applies to what it chooses as well as how it tells it.

topics:
  # THE WORD ENTERED ENGLISH THROUGH AN ARMY PAPERWORK TRAIL, which is the kind
  # of provenance this show exists for. Visum et Repertum (1732) is a signed
  # military medical report on an exhumation, it is online in translation, and
  # the belief it was investigating is far older and far more widespread than
  # the report - so the `world` beat has centuries of burial custom to lay out
  # before the `story` beat opens a single grave.
  #
  # Chosen over "vampires across cultures" deliberately. A survey is a subject,
  # not a story, and this sheet would fight it from the first beat. The
  # investigations carry the whole history and still have a sequence, named
  # people and an ending.
  - How the vampire got into the written record - the Habsburg military
    investigations in Serbia between 1725 and 1732, from the Visum et Repertum
    report on Arnold Paole and the earlier account of Petar Blagojevic, the
    older beliefs about the returning dead that the villagers were acting on,
    and how an army surgeon's paperwork put the word into every European
    language

  # ETCSL at Oxford has the full composite text in translation, line-numbered,
  # plus the variant tablets - which is close to a perfect source for this show.
  # The seven gates give the middle beat a spine, and Inanna's substitute at the
  # end is where the versions get complicated.
  - The Descent of Inanna to the underworld, from the Sumerian tablets - the
    seven gates, what she is required to give up at each one, and the argument
    about who she sends to take her place

  # The Sampo is the best possible subject for a show that says plainly when
  # nobody knows something: it is the object the whole epic turns on and no two
  # scholars agree what it is. Kirby's 1907 translation is on Gutenberg, and
  # Lonnrot's 1835 and 1849 versions genuinely differ.
  - The Sampo in the Kalevala - a thing forged, fought over and broken, that
    nobody has ever been able to say what it actually was, and how Lonnrot's
    first version of the story differs from his second

  # The manuscript story here is as good as the myth: one copy, made by a priest
  # in Guatemala who transcribed and translated it side by side, and the
  # original he worked from is gone.
  - The Hero Twins and the lords of Xibalba, from the Popol Vuh - a ballgame
    played against the dead, and the single eighteenth-century manuscript that
    is the only reason any of it survives

  # Lady Charlotte Guest's translation is on Sacred Texts. The talking head that
  # keeps company for eighty years is the kind of detail this show exists for,
  # and the Welsh manuscripts differ on the ending.
  - Branwen daughter of Llyr, from the Mabinogion - a starling carrying a
    message across the Irish Sea, a cauldron that returns the dead without their
    voices, and a severed head that stays good company for eighty years

  # A frame story where the frame is the point, and Burton's 1870 translation is
  # public domain. Each riddle ends with a question the king must answer, and
  # answering costs him the corpse.
  - The Vetala and King Vikramaditya, from the Baital Pachisi - a corpse-spirit
    carried nightly on a king's back, twenty-five stories, and a rule that makes
    the king lose every time he knows the answer

  # Afanasyev's collection is translated and online. The nested hiding place is
  # the most-copied idea in folklore and almost nobody knows where it comes from.
  - Koschei the Deathless, from the Russian tales Afanasyev collected - a man
    who keeps his death outside his body, in a needle, in an egg, in a duck, in
    a hare, in a chest, under an oak, on an island

  # Chamberlain's 1882 Kojiki translation is on Sacred Texts. Eight heads, eight
  # vats of sake, and a sword found in the tail that becomes one of the three
  # imperial regalia - so the myth is still doing work in the present.
  - Yamata no Orochi, from the Kojiki - an eight-headed serpent, a plan built
    entirely on sake, and the sword found in its tail that Japan still counts
    among its imperial regalia

  # Told with a painted scroll, overnight, by bhopas who light the panels with a
  # lamp as they sing. The performance IS the text, which gives the provenance
  # thread something unusual to say. John D. Smith's edition and his field notes
  # are the scholarly anchor.
  - The epic of Pabuji, from Rajasthan - a story that is not read but sung
    across a painted cloth by lamplight over a whole night, and what happens to
    a story when the scroll is the book

# ---------------------------------------------------------------------------
# SETS. Subjects for `ten-stories`, which is a different kind of thing entirely.
#
# An entry in `topics:` above names ONE story, told properly for fifteen
# minutes. An entry here names a BODY OF MATERIAL to pick ten separate stories
# out of, each of which becomes its own ninety-second short with its own run,
# its own ledger and its own gate.
#
# WHAT MAKES A GOOD SET, and it is almost the opposite of what makes a good
# episode above:
#
#   1. TEN STORIES HAVE TO EXIST IN IT, and be genuinely different from each
#      other. A tradition, a pantheon, a collection, a category. Not a theme
#      that forces ten angles on one thing - "ten cultures looking at the same
#      night sky" sounds good and produces ten versions of one idea.
#   2. EACH HAS TO STAND ALONE. Somebody meets one of these in a feed having
#      heard none of the others, so a set built on a single continuous saga is
#      the wrong shape however good the saga is.
#   3. TEXTS FOR ALL TEN, not for the famous three. This is where a set fails
#      in practice: a tradition everybody has heard of whose minor stories were
#      never translated leaves seven beats with nothing to bind to.
#   4. THE FAMOUS ONES CAN BE IN IT. A set that avoids them on principle is a
#      set of things nobody has a reason to care about. The rule is range, not
#      obscurity.
#
# Each of these is one `make --format ten-stories` run of about £1.20, then
# `shorts` cuts it into ten runs at about 4p each.
sets:
  # The obvious first one, and the trap is that the Prose Edda's famous chapters
  # crowd out everything else. The brief is told to range, which here means
  # Idunn's apples and Hymir's cauldron alongside Ragnarok.
  - Norse mythology past the three stories everybody knows - the thefts, the
    bargains, the disguises and the arguments between gods that the Prose Edda
    and the Poetic Edda spend most of their pages on

  # Enormous and almost entirely untranslated in popular form, so the range is
  # real. Ganesha's head and Shiva's dance are the famous ones; the rest are
  # not, and they are stranger.
  - Hindu mythology beyond the two epics - the stories in the Puranas about how
    gods got their bodies, their vehicles, their curses and the objects they
    carry

  # Budge and Faulkner are both online. Death, judgement, magic and a great deal
  # of administration, which is the part nobody expects.
  - Ancient Egyptian myth as the Egyptians actually wrote it down - the
    coffin texts, the Book of the Dead and the stories of gods arguing over
    inheritance in what reads like a court transcript

  # The Kojiki and the Nihon Shoki, both translated. Creation, exile, sun gods
  # hiding in caves, and a striking amount of negotiation.
  - Japanese myth from the Kojiki and the Nihon Shoki - the oldest written
    stories in Japan, including how the islands were made and why the sun once
    had to be tricked out of a cave

  # Popol Vuh plus the Yucatec and Aztec material. Ximenez's manuscript is
  # online and the provenance is genuinely strange.
  - Mesoamerican myth from the Popol Vuh and what survived the burnings - the
    ball games, the twin brothers, the four attempts at making people and what
    went wrong with each

  # Not a pantheon but a category, which makes standing alone easy.
  - Ten monsters people genuinely believed were real, and the animal, illness or
    misread document underneath each one

  # The Irish cycles, translated in full by Lady Gregory and others. Cattle
  # raids, geasa, and a hero literature with unusually specific rules.
  - Irish myth from the four cycles - the cattle raid, the taboos that kill the
    people bound by them, and the invasions that each explain a different part
    of the landscape

  # Every tradition has one and they disagree completely about what the dead
  # owe, which gives each short its own shape.
  - Ten gods of the dead from ten traditions - what each one actually wanted
    from the living, and what the texts say happens to somebody who does not
    provide it
