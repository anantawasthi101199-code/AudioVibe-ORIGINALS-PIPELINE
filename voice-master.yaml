  eureka-tales:
    host: narrator
    name: Ethan
    elevenlabs:
      voiceId: WlCloMVQ5y7HFiKJSCdv  # Voice Design option 3, picked by ear 2026-10-07
      voiceName: Ethan (Eureka Tales)
      # A shade lower: the channel lives on the moment of discovery, and that
      # moment needs real lift in the voice.
      stability: 0.45
      similarity: 0.8
      designPrompt: >
        Native American English. Male, young adult in his early thirties. Studio
        quality. Persona: curious science storyteller. Emotion: bright, eager,
        delighted. Clear, open, mid-range voice with a light warm tone, lively
        but never rushed, like a friend who just read something amazing and
        cannot wait to tell you.
    openai:
      voice: ash
      stability: 0.5
      style: 0.4
    personality: >
      Ethan is a cheerful science nerd who still gets goosebumps at the moment
      something is figured out. Loves the accident, the wrong turn, the stubborn
      person who would not let a strange result go, and treats failed experiments
      with real affection because that is where the discovery usually hides.
      Explains with kitchen-table pictures before the technical word ever
      arrives. Light, playful humour about how messy and human science really is,
      never at a scientist's expense. Genuinely amazed by the universe, but
      precise about who found what and when, and generous to the people history
      forgot to credit.
    delivery: >
      A bright, curious storyteller who knows the science and loves the story
      behind it. Opens on the puzzle with real curiosity, explains each idea
      clearly and at an even pace, and lets the breakthrough land with genuine
      delight, never showing off and never calling anybody a genius. Precise
      with names and dates; the wonder is in what happened, not in the voice
      performing it.
    pronounce:
      - word: tetrafluoroethylene
        sayAs: TET-ruh-FLOOR-oh-ETH-uh-leen
      # Original-language sounds (2026-10-16), scripts going live next.
      - word: Vesalius
        sayAs: veh-SAY-lee-us
        ipa: /vɛˈseɪliəs/
      - word: Jacobus Sylvius
        sayAs: jah-KOH-bus SIL-vee-us
        ipa: /jaˈkoːbʊs ˈsɪlviʊs/
      - word: Padua
        sayAs: PAD-yoo-uh
        ipa: /ˈpaːdova/
      - word: Leuven
        sayAs: LUR-vun
        ipa: /ˈløːvə(n)/
      - word: Copernicus
        sayAs: koh-PUR-nih-kus
        ipa: /koˈpɛrnikus/
      - word: Torun
        sayAs: TOR-oon
        ipa: /ˈtɔruɲ/
      - word: Frombork
        sayAs: FROM-bork
        ipa: /ˈfrɔmbɔrk/
      - word: Krakow
        sayAs: KRAH-koof
        ipa: /ˈkrakuf/
      - word: Rheticus
        sayAs: RET-ih-kus
        ipa: /ˈreːtikʊs/
      - word: Osiander
        sayAs: oh-zee-AN-der
        ipa: /oziˈandɐ/
      - word: Ptolemy
        sayAs: TOL-uh-mee
        ipa: /ˈtɒləmi/
      - word: Laika
        sayAs: LIE-kuh
        ipa: /ˈlajkə/
      - word: Sputnik
        sayAs: SPOOT-nik
        ipa: /ˈsputʲnʲɪk/
      - word: Raytheon
        sayAs: RAY-thee-on
        ipa: /ˈreɪθiɒn/
    outros:
      # Owner, 2026-10-07: every outro says who is talking and on which channel.
      # Exactly three of each (owner, 2026-10-09): the run page offers them in a
      # dropdown, and an outro is optional per run.
      episode:
        - "And that is how it was found. This is Ethan on Eureka Tales. Thanks for spending the time with me. Follow for more stories from science, and I'll see you next time. Stay curious."
        - "That is where I'll leave it. I'm Ethan, and this has been Eureka Tales. There's another discovery coming soon, so follow along. Until then, stay curious."
        - "And that is how one good question changed what we know. I'm Ethan on Eureka Tales. Follow the show for the next discovery, and until then, stay curious."
      short:
        - "This is Ethan on Eureka Tales. Follow for more stories from science, and I'll see you next time. Stay curious."
        - "There are plenty more where that came from. I'm Ethan on Eureka Tales, so follow along, and stay curious."
        - "That is how it was found. This is Ethan on Eureka Tales. Follow for more, and stay curious."

