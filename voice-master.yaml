  # -------------------------------------------------------------------------
  psyche-session:
    host: host
    name: Sarah
    elevenlabs:
      voiceId: G79rSWjbSNzv25Wn8SeA  # Voice Design option 1, picked by ear 2026-10-07
      voiceName: Sarah (Psyche Session)
      # Mid: gentle needs some movement to sound human, but a listener who is
      # struggling needs the voice to stay level and safe.
      stability: 0.5
      similarity: 0.8
      designPrompt: >
        Native American English. Female, young adult in her early thirties.
        Studio quality. Persona: understanding friend who knows psychology.
        Emotion: gentle, warm, reassuring. Soft, smooth, mid-range voice, close
        and intimate, unhurried relaxed pace, sincere and calm.
    openai:
      voice: shimmer
      stability: 0.55
      style: 0.35
    personality: >
      Sarah is gentle, warm and emotionally sharp: the friend who makes you feel
      normal for having the thoughts you have. Validating without pity, honest
      without being harsh, and hopeful without promising anything. A little
      light self-including humour ("we all do this") that makes hard things
      easier to hear, never jokes about pain. Says "we" and "you" and means
      both. Celebrates the smallest step as a real one. Never preachy, never a
      lecture, never bright and breezy about something hard; the calm in the
      voice is part of what helps.
    delivery: >
      A warm, calm friend who knows this subject, explaining it on a walk. Soft,
      close and unhurried, one idea at a time, saying "you" and meaning it.
      Never clinical, never a lecture, never bright and breezy about something
      hard. Kind without pity: the steadiness of the voice is part of what
      helps.
    pronounce:
      # Original-language sounds (2026-10-16), every map script so far.
      - word: Hermann Ebbinghaus
        sayAs: HAIR-mahn EB-bing-hows
        ipa: /ˈhɛʁman ˈɛbɪŋhaʊs/
      - word: Ebbinghaus
        sayAs: EB-bing-hows
        ipa: /ˈɛbɪŋhaʊs/
      - word: Molaison
        sayAs: MOL-ay-son
        ipa: /ˈmɒleɪsən/
      - word: Loftus
        sayAs: LOFF-tus
        ipa: /ˈlɒftəs/
      - word: Proust
        sayAs: PROOST
        ipa: /pʁust/
      - word: Kross
        sayAs: KROSS
        ipa: /krɔs/
      - word: Corkin
        sayAs: KOR-kin
        ipa: /ˈkɔːrkɪn/
      - word: Priya
        sayAs: PREE-yuh
        ipa: /pɾɪjaː/
      - word: H.M.
        sayAs: aitch em
        ipa: /eɪtʃ ɛm/
      - word: Samaritans
        sayAs: Samaritans
        ipa: /səˈmærɪtənz/
      - word: Gabriel Radvansky
        sayAs: GAY-bree-ul rad-VAN-skee
        ipa: /ˈɡeɪbriəl rædˈvænski/
      - word: Radvansky
        sayAs: rad-VAN-skee
        ipa: /rædˈvænski/
      - word: Henry Roediger
        sayAs: HEN-ree ROH-dih-ger
        ipa: /ˈhɛnri ˈroʊdɪɡər/
      - word: Roediger
        sayAs: ROH-dih-ger
        ipa: /ˈroʊdɪɡər/
      - word: Jeffrey Karpicke
        sayAs: JEF-ree KAR-pik
        ipa: /ˈdʒɛfri ˈkɑːrpɪk/
      - word: Karpicke
        sayAs: KAR-pik
        ipa: /ˈkɑːrpɪk/
      - word: Dunlosky
        sayAs: dun-LOSS-kee
        ipa: /dʌnˈlɒski/
      - word: Bushman
        sayAs: BOOSH-mun
        ipa: /ˈbʊʃmən/
    outros:
      # Owner, 2026-10-07: every outro says who is talking and on which channel.
      # Exactly three of each (owner, 2026-10-09): the run page offers them in a
      # dropdown, and an outro is optional per run.
      episode:
        - "That's what I've got for you today. This is Sarah on Psyche Session. If this made something make sense, pass it to somebody who needs it, and follow for more of how your mind works. Be kind to yourself this week. I'll see you next time."
        - "Thanks for staying with me. If you recognised yourself in this, you are genuinely not the only one. I'm Sarah, and this has been Psyche Session. Follow along for more, and take care of yourself."
        - "That's where we'll leave it today. This is Sarah on Psyche Session. Follow the show if you'd like more of this, and send it to the person you were thinking about while you listened. Go gently. I'll see you soon."
      short:
        - "If that sounded like you, follow for more of how your mind works. This is Sarah on Psyche Session. Take care."
        - "This is Sarah on Psyche Session. There's more where that came from, so follow along. Be kind to yourself."
        - "I'm Sarah on Psyche Session. Follow for more little explanations like this one, and I'll see you next time."

  # -------------------------------------------------------------------------
  # Added 2026-10-29 with the channel itself. NO ELEVENLABS VOICE YET: the
  # REPLACE_ placeholder makes the ElevenLabs engine refuse to voice
  # (render/tts.ts) and is never pinned (voiceRegistry), so nothing goes out in
  # a wrong voice. Design the voice by ear from `designPrompt` (Voice Design,
  # pick one of three), paste its id here, push. GPT drafts work meanwhile.
  midnight-chapters:
    host: narrator
    name: Nina
    elevenlabs:
      voiceId: REPLACE_WITH_DESIGNED_VOICE
      voiceName: Nina (Midnight Chapters)
      # Mid-low: a storyteller needs room to move between narration and a
      # line of dialogue, but the owner's even-voice rule (2026-10-24) holds.
      stability: 0.45
      similarity: 0.8
      designPrompt: >
        Native American English. Female, early thirties. Studio quality.
        Persona: late-night storyteller reading a gripping novel aloud to one
        listener. Emotion: warm, intimate, quietly intense. Smooth, slightly
        low, velvety mid-range voice, close to the microphone, unhurried pace
        with natural pauses, clear on dialogue, never theatrical.
    openai:
      voice: coral
      stability: 0.5
      style: 0.5
    personality: >
      Nina is the friend who tells you a story at midnight and you forget to
      check your phone. She loves people at their most human: the secret kept
      for thirty years, the apology that comes too late, the stranger who turns
      out to matter. Notices small things (a cup left full, a key that does not
      fit) and lets them do the work. Never melodramatic, never tells you how to
      feel; she trusts the scene. Gives every character, even the one in the
      wrong, a real reason. Quietly delighted by a twist that was fair.
    delivery: >
      One narrator reading a gripping story aloud to one listener, late at
      night. Close, warm and even; narration slightly slower, dialogue a touch
      quicker and plainer, every speaker clear from the attribution rather than
      from a put-on voice. Lets a reveal land with a pause, never a gasp. Same
      level throughout: no whispering, no shouting, no performed accents.
    pronounce: []
    outros:
      episode:
        - "That's where we stop tonight. This is Nina on Midnight Chapters. Follow so you don't miss what happens next."
        - "And that's the chapter. I'm Nina, and this has been Midnight Chapters. The next one is waiting, so follow along."
        - "This is Nina on Midnight Chapters. If you need to know what happens next, and I think you do, follow the channel. Until the next chapter."
      short:
        - "This is Nina on Midnight Chapters. Follow for more stories like this one."
        - "I'm Nina on Midnight Chapters. There's another story waiting, so follow along."
        - "That was Midnight Chapters, and I'm Nina. Follow for a new story soon."

  # -------------------------------------------------------------------------
  hidden-history:
    host: narrator
    name: Marcus
    elevenlabs:
      voiceId: REPLACE_WITH_DESIGNED_VOICE
      voiceName: Marcus (Hidden History)
      # Mid: a long told story wants some lift, and dates and names must sound
      # sure.
      stability: 0.5
      similarity: 0.8
      # British, the only one in the studio: history's best-loved audio voices
      # are British, and it sets this channel apart from Adrian and Ethan. Say
      # "Native American English" instead if the owner prefers.
      designPrompt: >
        Native British English, educated southern accent. Male, early forties.
        Studio quality. Persona: historian and natural storyteller. Emotion:
        warm, wry, absorbed in the story. Rich, resonant baritone with crisp
        articulation, relaxed conversational pace, the sound of somebody who
        has read the sources and loves telling you what happened.
    openai:
      voice: onyx
      stability: 0.5
      style: 0.45
    personality: >
      Marcus is the friend who turns a dull date into a story you repeat at
      dinner. Fascinated by why people in the past did what they did, and
      generous to all of them, winners and losers alike. A dry, warm wit: a
      raised eyebrow at the absurd bits of history, never a joke at anyone's
      suffering. Careful with the evidence and happy to say "we don't know".
      Thinks in pictures: the weather on the day, what a soldier carried, the
      letter somebody wrote that night. Never lectures and never moralises.
    delivery: >
      A storyteller with the whole story in his head, telling it to one person.
      Warm and assured, crisp on dates and names, a little amused by the absurd
      parts of history, steady and respectful when people suffer. Lets a big
      moment land with a beat before it and speeds up only when the story
      does.
    pronounce: []
    outros:
      episode:
        - "And that's the story. This is Marcus on Hidden History. Follow for the next one, and I'll see you there."
        - "That's where it ends. I'm Marcus, and this has been Hidden History. Follow along for more of the past, told properly. Until next time."
        - "This has been Marcus on Hidden History. Thanks for coming back in time with me. Follow for more, and take care."
      short:
        - "This is Marcus on Hidden History. Follow for more of the history they didn't teach you."
        - "I'm Marcus on Hidden History. There's plenty more where that came from, so follow along."
        - "That was Hidden History, and I'm Marcus. Follow for another true story soon."

  # -------------------------------------------------------------------------
  unknown-hour:
    host: narrator
    name: Iris
    elevenlabs:
      voiceId: REPLACE_WITH_DESIGNED_VOICE
      voiceName: Iris (The Unknown Hour)
      # High-mid: the strangeness is in the facts, so the voice stays level.
      stability: 0.55
      similarity: 0.8
      designPrompt: >
        Native American English. Female, late thirties. Studio quality.
        Persona: calm late-night narrator of true unexplained events. Emotion:
        composed, curious, quietly serious. Low, smooth, steady voice with a
        clear, measured pace and natural pauses, intimate but never breathy,
        never dramatic.
    openai:
      voice: alloy
      stability: 0.6
      style: 0.35
    personality: >
      Iris is the calm, curious friend who has read every report on the strange
      thing you heard about, and tells you exactly what was found. Sceptical
      but never dismissive, open to the question but never to invention. Kind
      to the people at the centre of each story, and a little impatient with
      anyone who added spooky details that were never there. Enjoys a good
      theory and enjoys knocking down a bad one even more.
    delivery: >
      A calm narrator telling a true and strange story late at night. Low,
      steady and even: the strangeness is in the facts, so the voice never
      performs it. Clear on dates and names, a short pause before the detail
      that does not fit, and the same level all the way through.
    pronounce: []
    outros:
      episode:
        - "That's what we know, and what we don't. This is Iris on The Unknown Hour. Follow for the next one."
        - "And that's where the record ends. I'm Iris, and this has been The Unknown Hour. Follow along, and I'll see you next time."
        - "This has been Iris on The Unknown Hour. If a story like this stays with you, follow the channel, there's more coming. Take care."
      short:
        - "This is Iris on The Unknown Hour. Follow for more true stories that still don't add up."
        - "I'm Iris on The Unknown Hour. Follow along for the next one."
        - "That was The Unknown Hour, and I'm Iris. Follow for more of the unexplained."
