# Eureka Tales - science told as stories.
#
# From the owner's channel sheet (2026-09-30): short stories of inventions,
# accidental discoveries, anything with a bit of drama; long form on
# controversial science, space journeys, Nobel prize winners and debunks.
# A man's voice, deep and intelligent, the register of a good science
# explainer. No ElevenLabs.
#
# ON THE STORY LANE for now, with told-story as its only format. A science
# short format of its own is the next piece of work for this channel: the myth
# short is written for myths and would say so.

id: eureka-tales
handle: eurekatales

name: Eureka Tales

category: Science & Tech

fiction: false

thesis: >
  One true story from science at a time - an invention, an accident that turned
  into a discovery, a journey into space, a fight over who was right - told in
  order, from the people who were there, and explained so that anybody can
  follow it by ear.

bio: >
  Science, told through stories. Accidental inventions, the mistakes that
  sparked discoveries, journeys into space, Nobel prize winners and the science
  people still argue about.

audience: >
  Somebody with headphones in who is curious about how things were found out,
  and has no science training. Assume real intelligence and no background at
  all. They will stop the moment they lose the thread and will not tell you
  when they do.

register: >
  Somebody who knows the science well and loves the story behind it, telling it
  to one curious person. Clear, unhurried and precise. Opens on the mystery
  that needed solving, then tells how it was solved, in order. Explains every
  idea the moment it is needed, in plain words, and never shows off.

hosts:
  - id: narrator
    name: Kabir
    role: >
      Has read the papers and the biographies, and tells you how the thing was
      actually found out. Explains the idea before it matters so nothing lands
      as magic, and says plainly when the record is thin or the credit is
      disputed.
    idiolect:
      turnWordsMean: 110
      questionRate: 0.05
      backchannelRate: 0.0
      signature:
        - "and that is the part nobody expected"
        - "here is what was actually going on"
    # voice: in voice-master.yaml (both engines, delivery, tags, pronunciations).

styleCard:
  sentenceWordsMean: 14
  sentenceWordsStdDevMin: 5
  questionsPer100Words: 0.5
  secondPersonPer100Words: 0.5
  hedgesPer100WordsMax: 2.5

  metaphorDomains:
    - kitchens and cooking
    - journeys and maps
    - machines and clocks
    - weather

  forbiddenPhrases:
    - mind-blowing
    - mind blown
    - genius
    - changed the world forever
    - little did they know
    - since the dawn of time
    - science says
    - scientists baffled
    - the rest is history

  catchphraseBudget: 2

canon:
  - kind: belief
    text: >
      The interesting part of a discovery is usually the wrong turn before it.
      Tell the mistake properly; it is the story.

  - kind: belief
    text: >
      An idea has to be explained before it matters, or the moment it pays off
      sounds like magic.

  - kind: taboo
    text: >
      Never present a disputed credit or a contested result as settled. If
      people still argue about who found it first or whether it holds, say so
      plainly and say who argues what.

  - kind: taboo
    text: >
      Never call anybody a genius. Say what they did, and let that carry it.

  - kind: stylistic_rule
    text: >
      Open on the question or the mystery that needed solving, in one or two
      sentences, then tell the story that answered it.

# No music by default, shorts included (owner, 2026-10-03): add your own track
# after the voice is made, in the studio's Background music panel. A run's
# --music still adds the synthesised bed.
music:
  short: false
  long: false

formats:
  - science-short
  - told-story

episodeSeconds: [600, 1200]

# Outros: in voice-master.yaml, said word for word (owner, 2026-10-07).


allowedRiskTiers:
  - general
  - named_person
