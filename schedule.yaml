# How often each show publishes.
#
# READ THIS BEFORE TURNING IT ON. `foundry tick` makes ONE thing and stops.
# Point a trigger at it - cron, Task Scheduler, a CI timer - as often as you
# like: what is due is computed from what was actually published, so firing
# twice in an hour changes nothing, and not firing for a week leaves a show
# visibly overdue rather than silently skipped.
#
#   npm run foundry -- due              what it thinks should happen, costs nothing
#   npm run foundry -- tick --dry-run   the same, from the command that would act
#   npm run foundry -- tick             make the next due thing
#
# A SHOW ABSENT FROM HERE NEVER COMES UP AS DUE. That is the off switch for one
# show; `paused` below is the off switch for all of them.

paused: false

# The zone every slot below is read in. Naming the zone rather than an offset
# means British Summer Time is handled by the platform's own database, so the
# studio does not publish an hour early for half the year.
timezone: Europe/London

shows:
  # Twice a week is deliberately ambitious for a show that reads primary
  # documents, and the topic queue is what keeps it honest: if nobody has
  # queued anything, `due` reports the show as waiting rather than inventing a
  # subject. A studio that picks its own subjects converges on whatever the
  # model finds most available, which is the same handful of stories everyone
  # else is already telling.

  # Weekly, and the flagship. A told story lives or dies on the telling, and
  # nothing about that gets better by doing it twice as often.
  crime-files:
    everyDays: 7
    # Friday evening. A told story is what somebody puts on when the week ends.
    slot: { day: fri, hour: 18 }
    perWeek: { episodes: 1, shorts: 2 }
    shortsPerEpisode: 2
    autoPublish: false

  # Weekly, because a serial trains an expectation and then has to keep it. A
  # drama that arrives whenever it is ready is one a listener stops waiting for.

  # Weekly. One myth told properly is the show; the anthology sets are a
  # separate thing and are not on a clock yet, because ten shorts arriving at
  # once is a publishing decision rather than a cadence.
  mythic-archives:
    everyDays: 7
    slot: { day: sun, hour: 10 }
    # One myth told properly on Sunday, three anthology shorts in the week.
    perWeek: { episodes: 1, shorts: 3 }
    # None from an episode. This show's short form comes from `ten-stories`
    # instead, which writes shorts that were built to stand alone rather than
    # cutting a minute out of a told story and hoping it survives.
    shortsPerEpisode: 0
    autoPublish: false

  # Weekly. The evidence work here is the slowest of any show - a health claim
  # has to clear T2 sourcing before it can be said at all - and there is no
  # version of this that is twice as fast without being worse.
  root-health:
    everyDays: 7
    # Tuesday morning. Nothing symbolic; it is the day nothing else goes out.
    slot: { day: tue, hour: 8 }
    # The evidence work here is the slowest in the studio, so three a week is
    # already ambitious. Eight approved shorts become just under three weeks.
    perWeek: { episodes: 1, shorts: 3 }
    shortsPerEpisode: 1
    autoPublish: false

  # NOT SCHEDULED, AND THAT IS THE DECISION RATHER THAN AN OMISSION. Read The
  # File reads one document in the news, so what it makes depends on what was
  # published that week, and a queue written a fortnight ahead is a queue of
  # stories that have moved on. It is run by hand when there is a document
  # worth reading, which is what `topics/read-the-file.yaml` is for.
  #
  # A show absent from this file never comes up as due, so leaving it out is
  # the off switch rather than a gap.
