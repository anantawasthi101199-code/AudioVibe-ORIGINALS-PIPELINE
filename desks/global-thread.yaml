# The The Global Thread news desk.
#
# THIS FILE EXISTING IS WHAT MAKES global-thread A NEWS CHANNEL. See
# src/news/desk.ts. To start another news channel (markets, tech, climate), copy
# this file and personas/global-thread.yaml under the new id and change the
# beat, the queries and the goodbye.

id: global-thread

# Said in the goodbye, and the default topic: `make --show global-thread`
# with no --topic reports today's most important story on this beat.
beat: geopolitics

# The morning sweep. Each is one Brave News request over the last 24 hours.
# Broad on purpose: the most important story is whichever the most outlets are
# carrying, and narrow queries would decide that in advance.
queries:
  - world news
  - foreign minister talks
  - sanctions
  - ceasefire
  - summit leaders

# THE ONE-DEPENDABLE-SOURCE LIST, most preferred first. Wire services and
# public-service broadcasters lead because they report rather than argue, and
# because their pages fetch. Paywalled outlets are further down: a paywall stub
# is rejected and the next outlet carrying the story is tried.
outlets:
  - host: apnews.com
    onAir: the Associated Press
  - host: bbc.co.uk
    onAir: the BBC
  - host: bbc.com
    onAir: the BBC
  - host: reuters.com
    onAir: Reuters
  - host: theguardian.com
    onAir: the Guardian
  - host: npr.org
    onAir: NPR
  - host: dw.com
    onAir: DW
  - host: france24.com
    onAir: France 24
  - host: aljazeera.com
    onAir: Al Jazeera
  - host: news.sky.com
    onAir: Sky News
  - host: cbsnews.com
    onAir: CBS News
  - host: abcnews.go.com
    onAir: ABC News
  - host: pbs.org
    onAir: PBS NewsHour
  - host: ft.com
    onAir: the Financial Times
  - host: economist.com
    onAir: the Economist
  # REGIONAL OUTLETS FOR THE ROUNDUP (2026-10-05). The first live roundup found
  # no India or China story because every outlet above is Western, and most of
  # a day's Indian news is carried by Indian newsrooms.
  - host: thehindu.com
    onAir: the Hindu
  - host: indianexpress.com
    onAir: the Indian Express
  - host: ndtv.com
    onAir: NDTV
  - host: hindustantimes.com
    onAir: the Hindustan Times
  - host: scmp.com
    onAir: the South China Morning Post
  - host: independent.co.uk
    onAir: the Independent
  - host: cnn.com
    onAir: CNN

maxAgeHours: 30
publishWithinHours: 48

# Headline words that put a story off this desk's beat.
excludeWords:
  - football
  - cricket
  - tennis
  - olympics
  - celebrity
  - recipe
  - horoscope
  - box office
  - premier league
  - weather forecast

country: ALL
language: en
music: false

# THE RAPID-FIRE ROUNDUP, made when no topic is given (owner, 2026-10-05): the
# most-carried story from each of these, one article each, under three minutes.
# A typed topic makes the in-depth short on that one story instead.
roundup:
  # SEVERAL SEARCHES PER REGION. One bare "United Kingdom" search returned
  # nothing from a desk outlet on the first live run; the region's capital and
  # government find what its outlets actually headline.
  regions:
    - name: India
      queries: [India, India government, New Delhi]
      match: [India, Indian, Delhi, Modi, Mumbai]
    - name: the US
      queries: [United States, White House, Washington]
      match: [US, U.S., America, American, Trump, White House, Washington, Congress, Senate]
    - name: the UK
      queries: [United Kingdom, UK government, Britain]
      match: [UK, Britain, British, England, London, Starmer, Westminster, Scotland, Wales]
    - name: China
      queries: [China, Beijing]
      match: [China, Chinese, Beijing, Xi, Taiwan, Hong Kong]
    - name: the world
      queries: [world news]
